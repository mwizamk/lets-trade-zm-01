<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Login | Let's Trade ZM</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <link
    rel="stylesheet"
    href="css/admin.css"
  >

</head>


<body>

<header class="navbar">

  <a
    href="index.html"
    class="logo"
  >
    <span>Let's</span> Trade ZM
  </a>

</header>


<main class="page">

  <section class="admin-section">

    <p class="eyebrow">
      ADMINISTRATOR ACCESS
    </p>

    <h1>
      Admin <em>Login.</em>
    </h1>

    <p class="intro">
      Sign in to access the Let's Trade ZM management console.
    </p>


    <form
      id="adminLoginForm"
      class="admin-form"
    >

      <label>

        Email

        <input
          id="adminEmail"
          type="email"
          required
          autocomplete="username"
          placeholder="Admin email"
        >

      </label>


      <label>

        Password

        <input
          id="adminPassword"
          type="password"
          required
          autocomplete="current-password"
          placeholder="Password"
        >

      </label>


      <button
        id="adminLoginButton"
        class="button"
        type="submit"
      >
        Sign in
      </button>


      <p
        id="adminLoginMessage"
        class="form-message"
        role="status"
      ></p>

    </form>

  </section>

</main>


<script
  type="module"
  src="js/admin-login.js"
></script>

</body>

</html>
