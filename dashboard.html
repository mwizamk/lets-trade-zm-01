<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Dashboard | Let's Trade ZM</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<header class="dashboard-header">
  <a href="index.html" class="logo"><span>Let's</span> Trade ZM</a>
  <button id="logoutBtn">Sign out</button>
</header>
<main class="dashboard">
  <div class="welcome"><span class="eyebrow">CUSTOMER DASHBOARD</span><h1>Hello, <span id="customerName"></span></h1><p>Manage your subscription assistance from one place.</p></div>
  <div class="dashboard-grid">
    <div class="dashboard-card"><span>CURRENT SERVICE</span><h2 id="serviceName">—</h2><p id="packageName">—</p></div>
    <div class="dashboard-card"><span>STATUS</span><h2 id="subscriptionStatus">Pending</h2></div>
    <div class="dashboard-card"><span>ORDER</span><h2 id="orderNumber">—</h2></div>
    <div class="dashboard-card"><span>AMOUNT</span><h2 id="amount">—</h2></div>
  </div>
  <section class="dashboard-section">
    <div class="section-heading-small"><h2>Customer information</h2></div>
    <div class="customer-info">
      <div><span>Name</span><strong id="infoName">—</strong></div>
      <div><span>Phone</span><strong id="infoPhone">—</strong></div>
      <div><span>Email</span><strong id="infoEmail">—</strong></div>
    </div>
  </section>
</main>
<script src="js/dashboard.js"></script>
</body>
</html>
