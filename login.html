<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let's Trade ZM | Customer Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<header class="navbar">
  <a href="index.html" class="logo"><span>Let's</span> Trade ZM</a>
  <a href="index.html" class="secondary-btn">Home</a>
</header>

<main class="auth-container">
  <section class="auth-card">
    <span class="eyebrow">CUSTOMER ACCESS</span>
    <h1>Welcome back</h1>
    <p>Enter the phone number or email you used when signing up.</p>

    <div id="loginMessage" class="form-message"></div>

    <form id="loginForm">
      <label for="loginIdentifier">Phone number or email</label>
      <input id="loginIdentifier" type="text" autocomplete="username" required
             placeholder="e.g. 097xxxxxxx or you@example.com">

      <button type="submit" class="primary-btn full-btn" id="loginButton">
        Continue
      </button>
    </form>

    <div class="auth-links">
      <a href="signup.html">New customer? Get started</a>
      <a href="index.html#prices">View PriceList</a>
    </div>
  </section>
</main>

<script type="module" src="js/login.js"></script>
</body>
</html>
