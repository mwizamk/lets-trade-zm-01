<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Login | Let's Trade ZM</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
<div class="login-box">
  <a href="index.html" class="logo"><span>Let's</span> Trade ZM</a>
  <div class="login-heading"><span class="eyebrow">CUSTOMER PORTAL</span><h1>Welcome back</h1><p>Enter your phone number or email and your 4-digit customer code.</p></div>
  <form id="loginForm">
    <div class="input-group"><label>Phone number or email</label><input id="loginIdentifier" type="text" placeholder="Phone or email" required></div>
    <div class="input-group"><label>4-digit code</label><input id="loginCode" type="text" inputmode="numeric" maxlength="4" placeholder="0000" required></div>
    <button type="submit" class="primary-btn full-btn">Sign in</button>
  </form>
  <p id="loginMessage" class="login-message"></p>
  <div class="login-footer">Don't have an account? <a href="signup.html">Sign up</a></div>
</div>
<script src="js/login.js"></script>
</body>
</html>
